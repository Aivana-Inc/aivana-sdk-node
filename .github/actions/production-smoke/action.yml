name: Production smoke test steps
description: >
  Builds the package, installs it into an empty folder and runs smoke/smoke.mjs against the production API
  (what it checks and why is in .github/workflows/smoke.yml and smoke/README.md).

# The steps are shared by the two jobs that run the smoke test, which are the manual workflow (smoke.yml) and the
# release gate (the `smoke` job in publish.yml). Both are ordinary jobs that declare `environment: production-smoke`,
# so each reads that environment's secret itself and hands it to this action as an input.
#
# It is NOT a reusable workflow on purpose. A reusable workflow called from publish.yml did not receive the
# environment's secret: the first release run (v0.8.0) failed with the key empty, while the same steps run directly
# by hand had it. A composite action runs inside the calling job, so there is nothing to pass across.
#
# The key is an input, never read from the secrets context here (a composite action cannot), and it reaches only
# the two steps that run the script, never the install or build steps.

inputs:
  api-key:
    description: The test account's API key, from the calling job's production-smoke environment secret.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 24
        package-manager-cache: false

    - name: Validate the lockfile
      shell: bash
      run: npm ci

    # What gets tested is the built package, not the source: a file missing from "files" in package.json, or a
    # broken export, shows up here and nowhere in the in-repo tests.
    - name: Build the package and install it into an empty folder
      shell: bash
      run: |
        out="$(mktemp -d)"
        npm pack --silent --pack-destination "$out"
        prefix="$RUNNER_TEMP/smoke-install"
        mkdir -p "$prefix"
        npm install --prefix "$prefix" --no-audit --no-fund "$out"/aivana-sdk-*.tgz
        cp smoke/smoke.mjs "$prefix/smoke.mjs"
        echo "SMOKE_DIR=$prefix" >> "$GITHUB_ENV"
        echo "EXPECTED_SDK_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

    # Costs nothing and calls nothing: catches a missing key or a bad address before the real run.
    - name: Check the setup (no calls)
      shell: bash
      working-directory: ${{ env.SMOKE_DIR }}
      env:
        AIVANA_API_KEY: ${{ inputs.api-key }}
      run: node smoke.mjs --dry-run

    - name: Run the smoke test against production
      shell: bash
      working-directory: ${{ env.SMOKE_DIR }}
      env:
        AIVANA_API_KEY: ${{ inputs.api-key }}
      run: node smoke.mjs
