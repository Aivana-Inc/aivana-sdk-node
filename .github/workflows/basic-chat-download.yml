name: Basic Chat download
on:
  workflow_dispatch:
  pull_request:
    paths: ["examples/basic-chat/**", "tools/*basic-chat.mjs", "test/basic-chat*.test.mjs", ".github/workflows/basic-chat-download.yml"]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test test/basic-chat-package.test.mjs
      - run: node tools/package-basic-chat.mjs aivana-basic-chat
      - run: python -m zipfile -c aivana-basic-chat.zip aivana-basic-chat
      - uses: actions/upload-artifact@v4
        with:
          name: basic-chat-candidate
          path: aivana-basic-chat.zip
          if-no-files-found: error
  installed:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v4
        with:
          name: basic-chat-candidate
          path: download
      - run: python -m zipfile -e download/aivana-basic-chat.zip "extracted with spaces"
      - run: npm ci
        working-directory: extracted with spaces/aivana-basic-chat
      - run: node tools/verify-basic-chat.mjs "extracted with spaces/aivana-basic-chat"
