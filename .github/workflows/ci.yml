name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor declared in package.json engines; 22 is what the
        # publish workflow uses. Both must stay green.
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      - run: npm test

      # Catches a missing file in package.json "files" before a release does.
      - name: Verify the published tarball contents
        if: matrix.node-version == 22
        run: npm pack --dry-run
