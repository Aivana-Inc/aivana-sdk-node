name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor declared in package.json engines; 24 is what the
        # publish workflow uses. Both must stay green.
        node-version: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      - run: npm test

      # Catches a missing file in package.json "files" before a release does.
      - name: Verify the published tarball contents
        if: matrix.node-version == 24
        run: npm pack --dry-run

      # Install @aivana/cli the way users will get it (packed, next to the SDK
      # version it pins) and run the real binary. Catches a broken bin path or
      # exports entry that the in-repo tests, which import src/ directly, cannot.
      - name: The packed @aivana/cli installs and runs
        if: matrix.node-version == 24
        run: |
          out="$(mktemp -d)"
          npm pack --silent --pack-destination "$out"
          (cd cli && npm pack --silent --pack-destination "$out")
          prefix="$(mktemp -d)"
          npm install --prefix "$prefix" --no-audit --no-fund "$out"/*.tgz
          got="$("$prefix/node_modules/.bin/aivana" --version)"
          want="aivana $(node -p "require('./package.json').version")"
          if [ "$got" != "$want" ]; then
            echo "got '$got', want '$want'" >&2
            exit 1
          fi

  # One fixed check name, `lint-and-build`, so a single org-level ruleset can
  # require it in every code repo. Don't rename it, and keep it separate from
  # the `test` matrix above. The package is plain JavaScript with hand-written
  # .d.ts files: it has no linter, no tsconfig and no build step, so "lint and
  # build" here is a clean install plus a dry-run pack of both published packages.
  lint-and-build:
    name: lint-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci

      - name: Pack @aivana/sdk (dry run)
        run: npm pack --dry-run

      - name: Pack @aivana/cli (dry run)
        run: npm pack --dry-run
        working-directory: cli
