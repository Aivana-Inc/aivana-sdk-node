name: Publish SDK

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # No dependencies, but this validates the committed lockfile.
      - name: Install dependencies
        run: npm ci

      # There is no build step — the package ships plain ESM source. Run the
      # offline tests instead so a broken tag never reaches the registry.
      - name: Test
        run: npm test

      # Fail loudly if the tag and package.json version disagree, rather than
      # publishing a version nobody asked for.
      - name: Check version matches the release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "release tag ($tag) != package.json version ($pkg)" >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
