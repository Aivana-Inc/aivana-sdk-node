name: Production smoke test

# Does the SDK, exactly as a developer would install it, work against the real Aivana API?
#
# It builds the package, installs the built .tgz into an empty folder (not the source tree) and runs
# smoke/smoke.mjs there against https://api.aivana.ai: three free checks and three tiny billed calls
# (smoke/smoke.mjs lists them and caps the billed ones). Two ways to start it:
#
#   - by hand: Actions > Production smoke test > Run workflow, before cutting a release or the day before an event
#   - as the gate in publish.yml: nothing is published to npm unless this passed on the commit being released
#
# SAFETY. The job holds a real production API key, so:
#   - it never runs for a pull request (there is no pull_request trigger, and a workflow a fork's pull request
#     edits cannot start this one);
#   - the key lives in the `production-smoke` ENVIRONMENT, not in repository secrets. In Settings > Environments,
#     add required reviewers and limit "Deployment branches and tags" to `main` and `v*`, so nobody can run this
#     job, or read its secret, from an arbitrary branch;
#   - the job has read-only access to the repository and NO `id-token` permission, so it cannot publish to npm or
#     impersonate this repository anywhere;
#   - the key is given to the one step that needs it and is hidden in every log line (GitHub masks it, and the
#     script redacts it again);
#   - only one run at a time (the concurrency group), so two runs never spend the test wallet together.
#
# The environment's secrets (see RELEASING.md, "Production smoke test"):
#   AIVANA_API_KEY   a key for a dedicated, permanent test account that is kept funded (smoke/README.md: funding and rotation),
#                    with the default scopes
#                    (generate and metrics: the quotas check needs metrics)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Production smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-smoke

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate the lockfile
        run: npm ci

      # What gets tested is the built package, not the source: a file missing from "files" in package.json, or a
      # broken export, shows up here and nowhere in the in-repo tests.
      - name: Build the package and install it into an empty folder
        run: |
          out="$(mktemp -d)"
          npm pack --silent --pack-destination "$out"
          prefix="$RUNNER_TEMP/smoke-install"
          mkdir -p "$prefix"
          npm install --prefix "$prefix" --no-audit --no-fund "$out"/aivana-sdk-*.tgz
          cp smoke/smoke.mjs "$prefix/smoke.mjs"
          echo "SMOKE_DIR=$prefix" >> "$GITHUB_ENV"
          echo "EXPECTED_SDK_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # Costs nothing and calls nothing: catches a missing key or a bad address before the real run.
      - name: Check the setup (no calls)
        working-directory: ${{ env.SMOKE_DIR }}
        env:
          AIVANA_API_KEY: ${{ secrets.AIVANA_API_KEY }}
        run: node smoke.mjs --dry-run

      - name: Run the smoke test against production
        working-directory: ${{ env.SMOKE_DIR }}
        env:
          AIVANA_API_KEY: ${{ secrets.AIVANA_API_KEY }}
        run: node smoke.mjs
