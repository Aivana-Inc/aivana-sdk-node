<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Basic AI Chat · Aivana</title>
    <link rel="icon" href="/assets/aivana-sparkle.avif" type="image/avif" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <a class="brand" href="https://aivana.ai/" target="_blank" rel="noreferrer" aria-label="Aivana website">
          <img src="/assets/aivana-logo.avif" alt="Aivana" width="112" height="32" />
          <span class="tag">Chat starter</span>
        </a>
        <nav class="header-actions" aria-label="Chat controls">
          <a class="docs" href="https://developers.aivana.ai/docs/quickstart" target="_blank" rel="noreferrer">Quickstart ↗</a>
          <button id="theme" class="secondary" type="button" aria-label="Switch color theme">Theme</button>
          <button id="reset" disabled class="new-chat" type="button"><span aria-hidden="true">＋</span> New chat</button>
        </nav>
      </header>
      <main>
        <section class="chat" aria-label="Basic AI Chat">
          <div id="transcript" class="transcript" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions text">
            <div id="empty" class="empty">
              <h1><img src="/assets/aivana-sparkle.avif" alt="" width="32" height="32" />What’s on your mind today?</h1>
              <p>A question, an idea, a little inspiration. Start here.</p>
            </div>
          </div>
          <p id="configuration-note" class="configuration-note" role="status" hidden></p>
          <p id="status" class="status" role="status"></p>
          <p id="error" class="error" role="alert" hidden></p>
          <form id="composer" class="composer">
            <label class="sr-only" for="message">Message Aivana</label>
            <textarea id="message" disabled name="message" rows="1" maxlength="4000" placeholder="Ask anything..." required aria-describedby="composer-hint"></textarea>
            <button id="stop" class="secondary" type="button" hidden>Stop</button>
            <button id="send" disabled class="primary" type="submit" aria-label="Send message"><span aria-hidden="true">↑</span></button>
          </form>
          <div id="suggestions" class="suggestions" aria-label="Ideas to get started">
            <button class="suggestion" type="button" data-prompt="Share some advice for turning an idea into a realistic plan.">Share advice</button>
            <button class="suggestion" type="button" data-prompt="Help me brainstorm a small business idea and its first steps.">Start a business</button>
            <button class="suggestion" type="button" data-prompt="Help me make a simple plan to learn a new language.">Learn a new language</button>
            <button class="suggestion" type="button" data-prompt="Help me make a study plan for an upcoming exam.">Help with school</button>
            <button id="example" class="suggestion" type="button" data-prompt="Help me plan and build a simple website. Where should I start?">Build a website</button>
          </div>
          <p id="composer-hint" class="composer-hint">Enter for a new line · Ctrl / ⌘ + Enter to send</p>
          <p class="footnote">API calls use account credit. New chat or a page reload clears this conversation.</p>
        </section>
      </main>
      <footer><span>Basic AI Chat</span><span>Built with <a href="https://developers.aivana.ai/docs/sdks" target="_blank" rel="noreferrer">Aivana SDK ↗</a></span></footer>
    </div>
  </body>
</html>
